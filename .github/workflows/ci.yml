name: Check Worknest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run check:publish
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          CI: true
      - run: npm run test:cloud
        env:
          CI: true
          WRANGLER_SEND_METRICS: "false"
      - run: npx wrangler deploy --dry-run --outdir artifacts/cloud-build
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: npm audit --audit-level=high
      - run: docker build -t worknest:ci .
